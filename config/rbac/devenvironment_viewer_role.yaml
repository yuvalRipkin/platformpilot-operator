# This rule is not used by the project platformpilot-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to platform.platformpilot.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: platformpilot-operator
    app.kubernetes.io/managed-by: kustomize
  name: devenvironment-viewer-role
rules:
- apiGroups:
  - platform.platformpilot.io
  resources:
  - devenvironments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.platformpilot.io
  resources:
  - devenvironments/status
  verbs:
  - get
