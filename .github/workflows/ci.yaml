name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scanners: "vuln,misconfig,secret"
          ignore-unfixed: true
          format: "table"
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          trivyignores: ".trivyignore.yaml"

      - name: Build
        run: make build

      - name: Test
        run: make test

  deploy:
    needs: [lint, build-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=v-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: ECR Login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ secrets.ECR_REPO_URL }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update manifests repo
        env:
          MANIFESTS_REPO_TOKEN: ${{ secrets.MANIFEST_REPO_TOKEN }}
          ECR_REPO_URL: ${{ secrets.ECR_REPO_URL }}
        run: |
          git clone --depth=1 https://x-access-token:${MANIFESTS_REPO_TOKEN}@github.com/yuvalRipkin/platformpilot-manifests.git
          cd platformpilot-manifests
          sed -i "s|image: .*|image: ${ECR_REPO_URL}:${IMAGE_TAG}|" deploy/install.yaml
          if git diff --quiet deploy/install.yaml; then
            echo "Manifest already up to date, skipping commit."
            exit 0
          fi
          git config --local user.name "github-actions"
          git config --local user.email "github-actions@github.com"
          git add deploy/install.yaml
          git commit -m "chore: update operator image to ${IMAGE_TAG}"
          git push || (git pull --rebase origin main && git push)
